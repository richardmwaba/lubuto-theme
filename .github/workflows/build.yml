name: Build

on:
  push:
  pull_request:

jobs:
  css:
    name: Compile stylesheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile every variant
        run: FATAL_DEPRECATIONS=slash-div ./parse-sass.sh
      - name: Install the full matrix into a scratch directory
        run: ./install.sh -d "$RUNNER_TEMP/themes" -t all
      - name: Check the installed tree
        run: |
          test -s "$RUNNER_TEMP/themes/Lubuto-Teal-Dark-Compact/gnome-shell/gnome-shell.css"
          test -s "$RUNNER_TEMP/themes/Lubuto-Teal-Dark-Compact/gtk-4.0/gtk.css"
          test -s "$RUNNER_TEMP/themes/Lubuto-Light/gtk-3.0/gtk.css"
          ls "$RUNNER_TEMP/themes" | wc -l
      - name: Install the GTK parsers
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 xvfb
      - name: Parse every GTK stylesheet with GTK itself
        run: |
          xvfb-run -a python3 -I tools/check-gtk-css.py 4 "$RUNNER_TEMP"/themes/*/gtk-4.0/*.css
          xvfb-run -a python3 -I tools/check-gtk-css.py 3 "$RUNNER_TEMP"/themes/*/gtk-3.0/*.css
