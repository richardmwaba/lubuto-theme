name: Build

on:
  push:
  pull_request:

jobs:
  css:
    name: Compile stylesheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint the extension
        run: npm run lint
      - name: Pack the extension
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gnome-shell-extensions libglib2.0-bin
          ./tools/build-extension.sh
          glib-compile-schemas --strict --dry-run extension/schemas
      - name: Compile every variant
        run: FATAL_DEPRECATIONS=slash-div ./parse-sass.sh
      - name: Install the full matrix into a scratch directory
        run: ./install.sh -d "$RUNNER_TEMP/themes" -t all
      - name: Check the installed tree
        run: |
          test -s "$RUNNER_TEMP/themes/Lubuto-Teal-Dark-Compact/gnome-shell/gnome-shell.css"
          test -s "$RUNNER_TEMP/themes/Lubuto-Teal-Dark-Compact/gtk-4.0/gtk.css"
          test -s "$RUNNER_TEMP/themes/Lubuto-Light/gtk-3.0/gtk.css"
          ls "$RUNNER_TEMP/themes" | wc -l

  gtk-parse:
    name: Parse stylesheets with the target GTK
    runs-on: ubuntu-latest
    # The theme targets GNOME 50. Ubuntu's GTK is older and rejects newer CSS,
    # so the parser check runs on Fedora 44, the reference platform.
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita, Xvfb and node
        run: dnf install -y -q gtk3 gtk4 libadwaita python3-gobject xorg-x11-server-Xvfb nodejs npm
      - run: npm ci
      - name: Install a representative set into a scratch directory
        run: ./install.sh -d /tmp/themes -t default teal -c light dark
      - name: Parse every GTK stylesheet with GTK itself
        env:
          GDK_BACKEND: x11
        run: |
          xvfb-run -a python3 -I tools/check-gtk-css.py 4 /tmp/themes/*/gtk-4.0/*.css
          xvfb-run -a python3 -I tools/check-gtk-css.py 3 /tmp/themes/*/gtk-3.0/*.css
