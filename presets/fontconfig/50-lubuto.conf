<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Lubuto crisp preset. The fonts step of install.sh copies this file to
  ~/.config/fontconfig/conf.d/; removing the file undoes it.

  Inter is the sans default and JetBrains Mono the monospace default. SF Pro
  is not redistributable, so a request for it resolves to Inter unless the
  user has installed SF Pro themselves, in which case fontconfig finds the
  real family first and the alias never applies.

  Rendering: slight hinting keeps vertical stems on the pixel grid without
  distorting letter shapes, and grayscale antialiasing avoids colour fringes
  on the displays this preset was tuned for. Glyph positions stay fractional:
  fontconfig has no key for that, GTK 4 does it unless gtk-hint-font-metrics
  is set, and gsettings.sh warns if it is.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro Text</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro Display</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Mono</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohinter" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
